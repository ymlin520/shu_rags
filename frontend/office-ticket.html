<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>處室詢問單回覆</title><link rel="stylesheet" href="/static/office-ticket.css?v=20260923-offices6"></head><body><main class="sheet"><header><div><small>校務問答・提問單回覆</small><h1 id="ticket-no"></h1><span id="badge"></span></div><div><small>主管單位</small><strong id="office"></strong></div></header><div id="loading">正在讀取詢問單…</div><div id="content" class="layout" hidden><section class="main"><article><div class="topline"><span>提問內容</span><small id="meta"></small></div><h2 id="subject"></h2><p id="description"></p><div class="ai">AI 查無資料　系統已建立詢問單交由本單位回覆。</div></article><article class="reply"><h3>回覆內容</h3><form id="form"><textarea id="resolution" rows="12" placeholder="請輸入回覆內容…" required></textarea><label class="faq-opt"><input id="faq" type="checkbox"><span>將本次回答整理成常見問題（之後學生問同樣的問題，AI 就能直接回答）</span></label><div><a href="/office">返回清單</a><button>送出回覆</button></div><p id="save-status"></p></form></article></section><aside><section class="transfer"><h3>這題不屬於本單位？</h3><label>轉給<select id="transfer-office"><option>教務處招生組</option><option>教務處註冊課務組</option><option>學務處生輔組</option><option>學務處課外組</option><option>學務處生涯組</option><option>學務處諮商中心</option><option>學務處衛保組</option><option>學務處宿舍中心</option><option>學務處原民中心</option><option>學務處軍訓室</option><option>兩岸事務中心</option><option>國際事務中心</option><option>總務處</option><option>圖書資訊處-網路組</option><option>圖書資訊處-系統組</option><option>圖書資訊處-圖書資訊服務組</option><option>教學發展中心-企劃管考組</option><option>教學發展中心-教學資源組</option><option>秘書室</option><option>人事室</option><option>會計室</option><option>稽核室</option><option>公共事務室</option><option>社會資源發展中心</option><option>舍我紀念館</option><option>民意調查中心</option><option>世新電台</option><option>其他行政單位</option></select></label><label>轉單原因<textarea id="transfer-reason" rows="3"></textarea></label><button id="transfer" type="button">確認轉出</button></section><section class="settle"><h3>銷案</h3><p class="settle-hint">亂問、測試訊息或與校務無關的提問，可直接銷案，不必回覆。銷案不會刪除詢問單，仍看得到紀錄。</p><p id="settle-state">尚未銷案</p><label>銷案原因（選填）<textarea id="settle-note" rows="2" placeholder="例如：測試訊息、與校務無關、重複提問"></textarea></label><button id="settle" type="button">銷案</button><p id="settle-status"></p></section><section class="timeline"><h3>處理紀錄</h3><div id="events"></div></section></aside></div></main><script src="/static/office-ticket.js?v=20260923-offices6"></script></body></html>
