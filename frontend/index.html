<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校務 FAQ 智慧問答</title><link rel="stylesheet" href="/static/style.css?v=20260831"><link rel="stylesheet" href="/static/llm.css?v=20260831"></head><body>
<main class="app-shell"><header class="topbar"><button id="menu-toggle" class="mobile-menu" type="button">☰</button><div class="brand-mark">FAQ</div><div class="brand-copy"><h1>校務 FAQ 智慧問答</h1><p>地端知識庫 × 地端 AI · 找不到答案可直接轉交承辦處室</p></div><span class="beta">AI 版 <small>BETA</small></span></header>
<div class="workspace"><aside id="sidebar" class="sidebar"><div class="mobile-sidebar-head"><strong>常見問題</strong><button id="menu-close" type="button">×</button></div><button id="new-chat" class="new-chat" type="button">＋ 新對話</button><div class="sidebar-heading"><p class="section-label">常見問題分類</p><span>選擇分類快速開始</span></div><nav class="category-list"><button class="category" data-query="選課相關常見問題"><span>01</span>選課相關</button><button class="category" data-query="實習相關常見問題"><span>02</span>實習相關</button><button class="category" data-query="畢業相關常見問題"><span>03</span>畢業相關</button><button class="category" data-query="成績與學籍常見問題"><span>04</span>成績與學籍</button><button class="category" data-query="獎助學金常見問題"><span>05</span>獎助學金</button><button class="category" data-query="宿舍住宿常見問題"><span>06</span>宿舍住宿</button><button class="category" data-query="教室與設備常見問題"><span>07</span>教室與設備</button><button class="category" data-query="資訊系統常見問題"><span>08</span>資訊系統</button><button class="category" data-query="交換與海外學習常見問題"><span>09</span>海外學習</button><button class="category" data-query="其他常見問題"><span>10</span>其他問題</button></nav><p class="sidebar-note">找不到分類？直接輸入完整問題即可。</p><section class="history-panel"><div class="history-heading"><strong>之前的對話</strong><button id="clear-history" type="button">清除</button></div><div id="history-list" class="history-list"></div></section></aside>
<section class="chat-panel"><div id="conversation" class="conversation" aria-live="polite"><div class="message-row assistant-row"><div class="avatar">AI</div><div class="message assistant-message"><p class="message-title">您好，我是校務 FAQ 助理</p><p>請選擇分類或直接輸入問題。如果知識庫無法解答，我可以協助建立工單並轉交指定處室。</p></div></div><div class="suggestions"><button data-example="最低修課學分是多少？">最低修課學分</button><button data-example="如何申請實習？">實習申請</button><button data-example="宿舍如何申請？">宿舍申請</button></div></div><div class="composer-wrap"><p id="status" role="status"></p><form id="search-form" class="composer"><textarea id="query" rows="1" placeholder="請輸入您的問題…" required></textarea><button id="submit" type="submit">送出 ↗</button></form><p class="disclaimer">回答由地端 AI 依 FAQ 整理；重要規定仍請以校方最新公告為準。</p></div></section></div></main>
<button id="mobile-new-chat" class="mobile-new-chat" type="button">＋</button><div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
<dialog id="ticket-dialog" class="ticket-dialog"><form id="ticket-form"><div class="admin-heading"><div><small>AI 自動分派</small><h2>建立服務工單</h2></div><button id="ticket-close" type="button">×</button></div><p class="ticket-intro">請留下聯絡方式與問題內容，AI 會自動判斷並送至適合的承辦處室。</p><label>工單主旨<input id="ticket-subject" maxlength="200" required></label><label>問題說明<textarea id="ticket-description" rows="5" maxlength="3000" required></textarea></label><div class="ticket-grid"><label>姓名<input id="ticket-name" maxlength="100" required></label><label>電子郵件或電話<input id="ticket-contact" maxlength="200" required></label></div><p id="ticket-status"></p><div class="dialog-actions"><button id="ticket-cancel" type="button">取消</button><button class="primary" type="submit">送出工單</button></div></form></dialog>
<script src="/static/app.js?v=20260901-local-rating" defer></script></body></html>
